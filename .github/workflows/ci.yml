# Runs the checks on every pull request (including update pull requests)
# and on main, so nothing broken reaches the server.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef
          SETUP_CODE: ci-only-setup-code-0123456789
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the container image
        run: docker build -t cardvault-ci .
      - name: Start it and check health
        run: |
          docker run -d --name cv -p 3000:3000 \
            -e SESSION_SECRET=ci-only-session-secret-0123456789abcdef \
            -e SETUP_CODE=ci-only-setup-code-0123456789 \
            -e APP_ORIGIN=http://localhost:3000 cardvault-ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs cv
          exit 1
